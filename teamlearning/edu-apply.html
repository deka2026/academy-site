/* 2026-11-06 이사장 지시: 홈페이지 「교육프로그램 신청」을 없애고, 주민자치·지역문제해결은 팀러닝, 연대지능활동가는 아카데미 안으로. 원본은 sakyowon-site renderEdu() */
:root{--green:#4a6741;--green-dark:#395032;--green-pale:#eef2ec;--ink:#2b2b28;--sub:#6b6b64;--line:#e3e1da;--bg:#f7f6f2;--card:#fff;--warn:#8a2a2a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding:4px 2px 16px}
.lead{font-size:14px;color:var(--sub);margin-bottom:12px}
.edu-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin-bottom:16px}
.edu-card h3{font-size:18px;font-weight:800}
.edu-sub{font-size:13px;color:var(--sub);margin:2px 0 10px}
.edu-lec-row{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.edu-lec{display:flex;gap:8px;align-items:flex-start;cursor:pointer;flex:1;min-width:0}
.edu-lec input{margin-top:5px;width:18px;height:18px;flex:none}
.edu-lec b{display:block;font-size:15px}.edu-lec b span{font-weight:400;color:var(--sub);font-size:13px}
.edu-lec div>span{display:block;font-size:13px;color:var(--sub)}
.edu-diag-btn{flex:none;border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--green);font-family:inherit;min-height:32px}
.edu-diag{background:var(--green-pale);border-radius:10px;padding:10px 12px;margin:0 0 8px;font-size:13px}
.edu-diag label{display:flex;gap:6px;align-items:flex-start;margin:4px 0}.edu-diag label input{margin-top:3px}
.edu-diag-h{margin-bottom:4px}.edu-diag-r{margin-top:6px;color:var(--sub)}.edu-diag-r.need{color:var(--green-dark);font-weight:700}
.edu-calc{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.edu-calc label{display:flex;flex-direction:column;font-size:13px;color:var(--sub);gap:3px}
.edu-calc input,.edu-calc select,.ap input,.ap textarea{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
.edu-calc input[type=number]{width:90px}
.edu-total{flex:1 1 220px}.edu-total .amt{font-size:20px;font-weight:800;color:var(--green-dark)}.edu-total .brk{font-size:12px;color:var(--sub)}
.btn{border:none;background:var(--green);color:#fff;border-radius:10px;padding:0 16px;min-height:44px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.ghost{background:#fff;color:var(--green);border:1px solid var(--green)}.btn:disabled{opacity:.5}
.ap{display:none;margin-top:12px;border:1px dashed var(--green);border-radius:12px;padding:12px;background:#fbfcfa}.ap.on{display:block}
.ap h4{font-size:15px;margin-bottom:6px}.ap .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ap label{display:flex;flex-direction:column;font-size:13px;color:var(--sub);gap:3px}
.ap .full{grid-column:1/-1}.ap textarea{min-height:90px}.ap .r{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.ap .msg{font-size:13px;margin-top:6px;min-height:1em}.ap .msg.err{color:var(--warn)}.ap .msg.ok{color:var(--green-dark);font-weight:700}
@media(max-width:560px){.ap .g{grid-template-columns:1fr}.edu-lec-row{flex-direction:column}.edu-diag-btn{align-self:flex-start;margin-left:26px}}
:focus-visible{outline:3px solid #b47d14;outline-offset:2px}
</style>

          '<div class="edu-diag-r" id="edu-dr-' + p.id + '-' + i + '">0/5 — 해당하는 항목을 골라 주세요</div></div></div>';
      }).join('') +
      '<div class="edu-calc"><label>인원 (명)<input type="number" min="1" step="1" value="20" id="edu-n-' + p.id + '"></label>' +
      '<label>교육 장소<select id="edu-r-' + p.id + '">' + EDU_TRAVEL.map(function (r) { return '<option value="' + r[1] + '">' + r[0] + ' (출장비 ' + (r[1] / 10000) + '만원)</option>'; }).join('') + '</select></label>' +
      '<div class="edu-total"><div class="amt" id="edu-t-' + p.id + '"></div><div class="brk" id="edu-b-' + p.id + '"></div></div>' +
      '<button class="btn" type="button" data-open="' + p.id + '">이 조건으로 신청하기</button></div>' +
      '<div class="ap" id="ap-' + p.id + '"><h4>신청하는 분</h4><div class="g">' +
      '<label>이름 *<input id="ap-name-' + p.id + '" maxlength="60" autocomplete="name"></label>' +
      '<label>연락처(전화·이메일) *<input id="ap-ct-' + p.id + '" maxlength="120"></label>' +
      '<label class="full">기관·단체<input id="ap-org-' + p.id + '" maxlength="120" autocomplete="organization"></label>' +
      '<label class="full">희망 일정·장소(시군구)·기타 요청<textarea id="ap-msg-' + p.id + '" maxlength="2000"></textarea></label></div>' +
      '<div class="msg" id="ap-r-' + p.id + '" role="status"></div><div class="r"><button class="btn ghost" type="button" data-close="' + p.id + '">닫기</button><button class="btn" type="button" data-send="' + p.id + '">신청 보내기</button></div></div></div>';
  }).join('');
  LIST.forEach(function (p) { calc(p.id); });
  var box = document.getElementById('eduList');
  box.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.edu) calc(t.dataset.edu);
    if (t.dataset.dq) diag(t.dataset.dq);
    if (t.id && /^edu-r-/.test(t.id)) calc(t.id.slice(6));
  });
  box.addEventListener('input', function (e) { if (/^edu-n-/.test(e.target.id)) calc(e.target.id.slice(6)); });
  box.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.dt) { var el = document.getElementById('edu-dg-' + b.dataset.dt); el.hidden = !el.hidden; b.setAttribute('aria-expanded', String(!el.hidden)); postH(); }
    if (b.dataset.open) { var q = quote(b.dataset.open); if (!q.lecs.length) { alert('강의를 하나 이상 골라 주세요.'); return; } document.getElementById('ap-' + b.dataset.open).classList.add('on'); document.getElementById('ap-name-' + b.dataset.open).focus(); postH(); }
    if (b.dataset.close) { document.getElementById('ap-' + b.dataset.close).classList.remove('on'); postH(); }
    if (b.dataset.send) send(b.dataset.send, b);
  });
}
function diag(key) {
  var id = key.split('-')[0], i = +key.split('-')[1];
  var n = document.querySelectorAll('input[data-dq="' + key + '"]:checked').length, r = document.getElementById('edu-dr-' + key);
  r.classList.toggle('need', n >= 3);
  if (n >= 3) { r.textContent = '✅ ' + n + '/5 — 이 강의가 필요합니다. 신청 목록에 넣었습니다.'; var c = document.querySelector('input[data-edu="' + id + '"][data-lec="' + i + '"]'); if (c && !c.checked) { c.checked = true; calc(id); } }
  else r.textContent = n ? n + '/5 — 지금은 꼭 필요하지 않을 수 있습니다(3가지 이상이면 필요). 신청 여부는 직접 고르세요.' : '0/5 — 해당하는 항목을 골라 주세요';
}
function diagSummary(id) {
  var p = EDU_PROGRAMS.find(function (x) { return x.id === id; });
  return p.lectures.map(function (l, i) { var n = document.querySelectorAll('input[data-dq="' + id + '-' + i + '"]:checked').length; return n ? (i + 1) + '강 ' + n + '/5' + (n >= 3 ? '(필요)' : '') : null; }).filter(Boolean);
}
function quote(id) {
  var p = EDU_PROGRAMS.find(function (x) { return x.id === id; });
  var lecs = Array.prototype.map.call(document.querySelectorAll('input[data-edu="' + id + '"]:checked'), function (c) { return +c.dataset.lec; });
  var n = Math.max(1, Math.floor(+document.getElementById('edu-n-' + id).value || 1));
  var sel = document.getElementById('edu-r-' + id), travel = +sel.value, region = sel.options[sel.selectedIndex].text.split(' (')[0];
  var hours = lecs.length * EDU_HOURS_PER_LEC, base = n * hours * EDU_UNIT;
  return { p: p, lecs: lecs, n: n, hours: hours, base: base, travel: lecs.length ? travel : 0, region: region, total: lecs.length ? base + travel : 0 };
}
function calc(id) {
  var q = quote(id);
  document.getElementById('edu-t-' + id).textContent = q.lecs.length ? q.total.toLocaleString() + '원' : '강의를 골라 주세요';
  document.getElementById('edu-b-' + id).textContent = q.lecs.length ? q.n + '명 × ' + q.hours + '시간 × 15,000원 = ' + q.base.toLocaleString() + '원 + 출장비(' + q.region + ') ' + q.travel.toLocaleString() + '원' : '';
}
function send(id, btn) {
  var q = quote(id), g = function (k) { return document.getElementById('ap-' + k + '-' + id).value.trim(); }, r = document.getElementById('ap-r-' + id);
  if (!q.lecs.length) { r.className = 'msg err'; r.textContent = '강의를 하나 이상 골라 주세요.'; return; }
  if (!g('name') || !g('ct')) { r.className = 'msg err'; r.textContent = '이름과 연락처를 적어 주세요.'; return; }
  var ds = diagSummary(id);
  var message = '[교육 신청] ' + q.p.title + '\n' +
    '- 선택 강의 (' + q.lecs.length + '강, ' + q.hours + '시간): ' + q.lecs.map(function (i) { return (i + 1) + '강 ' + q.p.lectures[i][0]; }).join(', ') + '\n' +
    '- 인원: ' + q.n + '명 / 교육 장소: ' + q.region + '\n' +
    '- 예상 비용: ' + q.total.toLocaleString() + '원 (' + q.n + '명 × ' + q.hours + '시간 × 15,000원 = ' + q.base.toLocaleString() + '원 + 출장비 ' + q.travel.toLocaleString() + '원)\n' +
    (ds.length ? '- 필요 진단 결과: ' + ds.join(', ') + '\n' : '') +
    '- 희망 일정·장소·기타: ' + (g('msg') || '(없음)');
  btn.disabled = true; r.className = 'msg'; r.textContent = '보내는 중…';
  fetch('/api/inquiries', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
    body: JSON.stringify({ name: g('name'), contact: g('ct'), org: g('org'), category: '교육·양성과정 문의', message: message, source: 'academy-edu-apply:' + id, user_lang: 'ko', ts: new Date().toISOString() }) })
    .then(function (x) { return x.json().catch(function () { return { ok: x.ok }; }); })
    .then(function (j) {
      btn.disabled = false;
      if (j && j.ok) { r.className = 'msg ok'; r.textContent = '신청이 접수됐습니다. 담당자가 적어 주신 연락처로 연락드립니다.'; ['name', 'ct', 'org', 'msg'].forEach(function (k) { document.getElementById('ap-' + k + '-' + id).value = ''; }); }
      else { r.className = 'msg err'; r.textContent = (j && j.error) || '보내지 못했습니다. 잠시 뒤 다시 해 주세요.'; }
      postH();
    }).catch(function () { btn.disabled = false; r.className = 'msg err'; r.textContent = '보내지 못했습니다(연결 문제). 잠시 뒤 다시 해 주세요.'; postH(); });
}
render(); postH(); window.addEventListener('resize', postH); setTimeout(postH, 300);
</script>
</body>
</html>
